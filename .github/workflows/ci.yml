name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content and privacy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public files
        run: python tools/check_repository.py
      - name: Rebuild and validate content
        run: |
          python tools/build_deck.py
          python tools/build_cards.py
          python tools/build_audit.py
          python tools/build_coins.py
          python tools/validate_assets.py
      - name: Reject stale generated files
        run: git diff --exit-code -- data prompts output

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libvulkan-dev
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Build client
        run: cargo build --locked --bin orcs-from-the-neighborhood
      - name: Check CLI and runtime artwork without a display
        shell: bash
        run: |
          target/debug/orcs-from-the-neighborhood --version
          target/debug/orcs-from-the-neighborhood --help
          target/debug/orcs-from-the-neighborhood --check-assets
